kind = "web"
previewPath = "/"
title = "Ecomm Storefront"
description = "Optional artifact preview for the imported Laravel storefront."
version = "1.0.0"
id = "artifacts/ecomm-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25501

[services.development]
run = "node ../../scripts/ecomm-preview-proxy.cjs"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecomm-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecomm-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25501"
BASE_PATH = ""
