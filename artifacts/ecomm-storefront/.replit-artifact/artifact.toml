kind = "web"
previewPath = "/storefront-artifact"
title = "Ecomm Storefront"
description = "Optional artifact preview for the imported Laravel storefront."
version = "1.0.0"
id = "artifacts/ecomm-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/storefront-artifact" ]
localPort = 25501

[services.development]
run = "bash ../../start-ecomm.sh"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecomm-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecomm-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25501"
BASE_PATH = "/storefront-artifact"
