kind = "web"
previewPath = "/"
title = "Ecomm Storefront"
description = "Development Preview route for the imported Laravel Ecomm storefront. It serves the Laravel source from the workspace root with local MySQL; production deployment is not configured by this preview bridge."
version = "1.0.0"
id = "artifacts/ecomm-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25501

[services.development]
run = "bash ../../start-ecomm.sh"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecomm-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecomm-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25501"
BASE_PATH = "/"
